<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Leads — Xevast admin</title><link rel="stylesheet" href="css/style.css">
<style>body{padding:40px 20px}table{width:100%;border-collapse:collapse;font-size:.88rem}td,th{border-bottom:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}th{color:var(--mu)}.bx{max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}.bx input{width:100%;margin:8px 0 14px;padding:12px;background:var(--bg);color:#fff;border:1px solid var(--line);border-radius:10px;font:inherit}</style><noscript><style>.reveal{opacity:1!important;transform:none!important}#loader{display:none!important}</style></noscript>
</head>
<body><div class="container"><h1 class="sec-title">Lead <span>inbox</span></h1><p id="msg" style="color:var(--red2)"></p>
<form id="login" class="bx"><label>Email</label><input id="em" type="email" required><label>Password</label><input id="pw" type="password" required><button class="btn" type="submit">Sign in</button></form>
<div id="app" hidden><p><button class="btn" id="out" type="button">Sign out</button></p><div style="overflow-x:auto"><table><thead><tr><th>When</th><th>Name</th><th>Service</th><th>Budget</th><th>Details</th></tr></thead><tbody id="tb"></tbody></table></div></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script>
<script>const $=i=>document.getElementById(i),C=window.XEVAST_FIREBASE,m=t=>$('msg').textContent=t;
if(!C||String(C.apiKey).startsWith('PASTE'))m('Add your Firebase config in js/firebase-config.js first.');else{firebase.initializeApp(C);const au=firebase.auth(),db=firebase.firestore();
au.onAuthStateChanged(u=>{$('login').hidden=!!u;$('app').hidden=!u;if(u)load()});
$('login').onsubmit=e=>{e.preventDefault();au.signInWithEmailAndPassword($('em').value,$('pw').value).catch(x=>m(x.message))};$('out').onclick=()=>au.signOut();
function load(){db.collection('leads').orderBy('at','desc').limit(200).get().then(q=>{$('tb').textContent='';q.forEach(d=>{const x=d.data(),r=document.createElement('tr');[x.at&&x.at.toDate?x.at.toDate().toLocaleString():'',x.name,x.service,x.budget,x.message].forEach(v=>{const c=document.createElement('td');c.textContent=v||'';r.appendChild(c)});$('tb').appendChild(r)})}).catch(x=>m(x.message))}}</script></body></html>
